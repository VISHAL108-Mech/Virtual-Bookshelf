<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edit Book Rating</title>
  </head>
  <body>
    <form action="{{ url_for('edit', id=book.id) }}" method="POST">
      <p>Book Name: {{ book.title }}</p>
      <p>Current Rating: {{ book.rating }}</p>
      <input type="text" name="rating" title="New Rating" />
      <button type="submit">Change Rating</button>
    </form>
  </body>
</html>
